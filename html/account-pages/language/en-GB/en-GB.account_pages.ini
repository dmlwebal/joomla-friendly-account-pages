; ================================================================
; Friendly Account Pages - plain UK English wording (registration, thank-you, profile, edit profile)
; The overrides load this file themselves; nothing needs merging into the site's own language files.
; To change a line for one site, use System > Language Overrides (it wins over this file and survives
; kit updates). Keys starting TPL_ACCOUNT_ are ours; the JFIELD_PASSWORD_RULES_* lines reword Joomla's
; own password hint sentence on these pages only.
; For another language, copy this folder's en-GB directory to e.g. de-DE, rename the file to
; de-DE.account_pages.ini and translate the values. Missing keys fall back to English.
; ================================================================

; ---- Password hint (Joomla builds "Your password needs at least 12 characters." from these) ----
JFIELD_PASSWORD_RULES_MINIMUM_REQUIREMENTS="Your password needs %s."
JFIELD_PASSWORD_RULES_CHARACTERS="at least %d characters (a few random words joined together works well)"
JFIELD_PASSWORD_RULES_DIGITS="%d number"
JFIELD_PASSWORD_RULES_LOWERCASE="%d small letter"
JFIELD_PASSWORD_RULES_UPPERCASE="%d capital letter"
JFIELD_PASSWORD_RULES_SYMBOLS="%d symbol"

